# Safety net (wave 0 of the remediation plan): no behaviour change lands in
# main without a backend test run against a real Postgres, a frontend
# typecheck and lint, its tests, and a build of the docker images.
#
# push is limited to main so that a branch with an open PR does not run
# everything twice: pull_request covers branches, push covers main itself
# after the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planora
          POSTGRES_PASSWORD: planora
          POSTGRES_DB: planora
        ports: ["5432:5432"]
        # Without a healthcheck the steps start before the database is ready to
        # accept connections, and the run flickers "connection refused" for no
        # reason at all.
        options: >-
          --health-cmd "pg_isready -U planora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://planora:planora@localhost:5432/planora
      APP_SECRET: ci-secret-not-for-production
      DIRECTOR_EMAIL: director@example.com
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Dependencies
        run: uv sync --locked

      # The tests work not against the database from DATABASE_URL but against
      # `<name>_test` derived from it (see backend/tests/conftest.py) — it has
      # to be created. Locally docker/postgres-init does this; the GitHub
      # Actions service container has no such scripts.
      - name: Test database
        run: psql postgresql://planora:planora@localhost:5432/planora -c 'CREATE DATABASE planora_test'

      - name: Tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (types, lint, tests, API contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc -b

      # The API types in src/api/schema.d.ts are generated from
      # backend/openapi.json (which is itself a snapshot of app.openapi(),
      # pinned by a backend test). If there is a diff after generation, the
      # snapshot was updated and the types were forgotten: run `npm run gen:api`
      # and commit the result.
      - name: API contract is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Tests with coverage
        run: npx vitest run --coverage

  docker:
    name: Image build (docker compose build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # compose declares env_file: .env and will not parse the configuration
      # without it; for a build the template is enough.
      - name: .env from the template
        run: cp .env.example .env

      - name: Build
        run: docker compose build
