[project]
name = "planora"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "email-validator>=2.3.0",
    # Симметричное шифрование ключа LLM секретом приложения: в стандартной
    # библиотеке шифров нет вовсе, а «зашифровать» его самодельно хуже, чем
    # не шифровать — самодельное выглядит защитой, не будучи ею.
    "cryptography>=43",
    # Список тем интервью лежит файлом конфигурации рядом с приложением.
    "pyyaml>=6",
    # Выгрузка проекта в книгу Excel. Формат — зазипованный XML со схемой в
    # несколько сотен элементов; писать его руками ради заливок, замороженной
    # шапки и условного форматирования дороже, чем взять библиотеку.
    "openpyxl>=3.1",
    # Выгрузка в PDF. Лента Ганта рисуется вектором на канве — то есть нужен не
    # шаблонизатор, а рисовалка. WeasyPrint отпал: он тянет cairo и pango
    # системными библиотеками, а сборка едет и на Vercel, где их нет.
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
    # Чтение готового PDF в тестах: проверяется, что в документе есть имя
    # проекта и имя задачи, а не только что байты начинаются с «%PDF».
    "pypdf>=5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
