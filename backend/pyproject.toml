[project]
name = "planora"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "email-validator>=2.3.0",
    # Symmetric encryption of the LLM key with the application secret: the
    # standard library has no ciphers at all, and "encrypting" it by hand is
    # worse than not encrypting — a homemade scheme looks like protection
    # without being one.
    "cryptography>=43",
    # The list of interview topics is a config file next to the application.
    "pyyaml>=6",
    # Project export to an Excel workbook. The format is zipped XML with a
    # schema of several hundred elements; writing it by hand for the sake of
    # fills, a frozen header and conditional formatting costs more than taking
    # a library.
    "openpyxl>=3.1",
    # Export to PDF. The Gantt chart is drawn as vectors on a canvas — so what
    # is needed is not a template engine but a drawing surface. WeasyPrint was
    # ruled out: it pulls in cairo and pango as system libraries, and the build
    # also runs on Vercel, where those are absent.
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
    # Reading the produced PDF in tests: it checks that the document contains
    # the project name and the task name, not merely that the bytes start with
    # "%PDF".
    "pypdf>=5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
