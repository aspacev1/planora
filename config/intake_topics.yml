# Mandatory interview topics.
#
# A config file next to the application rather than a table in the database:
# whoever deploys will edit it, not the end user. Moving it into organization
# settings is for when there is demand for industry-specific intake templates.
#
# key    — machine key of the topic; the model marks covered topics by it;
# prompt — a hint to the model about what to ask, in the development language.
#          The model phrases the question for a human itself, in the session's
#          language.
topics:
  - key: goal
    prompt: Цель проекта — какой результат считается успехом
  - key: scope
    prompt: Объём работ — что именно предстоит сделать
  - key: deadline
    prompt: Сроки и целевая дата
  - key: people
    prompt: Кто участвует и кто за что отвечает
  - key: constraints
    prompt: Ограничения — бюджет, технологии, согласования, зависимости от других
  - key: done
    prompt: Что уже готово или начато
  - key: out_of_scope
    prompt: Что в проект точно не входит
